%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/mira016.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ams 1/11-Inch 0.16 Mpixel CMOS Global Shutter Digital Image Sensor

maintainers:
  - Philippe Baetens <philippe.baetens@ams-osram.com>
  - Philippe Baetens <philippebaetens@gmail.com>


description: |-
  The Ams mira016 is a 1/11-inch CMOS active pixel digital image sensor
  with an active array size of 400 x 400V. It is programmable through
  I2C interface. The I2C address is fixed to 0x36 as per sensor data sheet.
  Image data is sent through MIPI CSI-2, using 1 data lane.

properties:
  compatible:
    const: ams,mira016

  reg:
    description: I2C device address
    maxItems: 1

  clocks:
    maxItems: 1

  vdd28-supply:
    description:
      Analog supply, 2.8 volts

  vdd11-supply:
    description:
      Digital supply, 1.1 volts


  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            description: |-
              The sensor only supports 1 lane.
            items:
              - const: 1

          clock-noncontinuous: true
          link-frequencies: true

        required:
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - vdd28-supply
  - vdd11-supply
  - port


additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        mira016: sensor@10 {
            compatible = "sony,mira016";
            reg = <0x10>;
            clocks = <&mira016_clk>;
            vdd28-supply = <&cam1_reg>;   /* 2.8v */
            vdd11-supply = <&cam_dummy_reg>;   /* 1.1v */

            port {
                mira016_0: endpoint {
                    remote-endpoint = <&csi1_ep>;
                    data-lanes = <1>;
                    clock-noncontinuous;
                    link-frequencies = /bits/ 64 <456000000>;
                };
            };
        };
    };

...
